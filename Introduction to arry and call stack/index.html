<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Introduction to Array and Call Stack</title>
</head>
<body>
    <h1>Arrays in JAVASCRIPT</h1>
    <p id="demo"></p>
    <p id="demo1"></p>
    <p id="demo2"></p>
    <script>
        var fruits=['Mangoes', 'Grapes', 'Banana', 'Oranges', 'Apples']
        document.getElementById("demo").innerHTML=fruits
        document.getElementById("demo1").innerHTML=fruits[1]
        document.getElementById("demo2").innerHTML=fruits.join("😁")
    </script>
</body>
</html>
